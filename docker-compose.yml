services:
  postgres:
    image: postgres:16-alpine
    container_name: homex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homex_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-homex_inventory}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homex} -d ${POSTGRES_DB:-homex_inventory}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: development
    container_name: homex-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://homex:homex_dev_password@postgres:5432/homex_inventory?schema=public}
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - uploads:/app/uploads
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: homex-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
      VITE_APP_NAME: ${VITE_APP_NAME:-Home-X Inventory}
      VITE_ENABLE_MOCKS: ${VITE_ENABLE_MOCKS:-true}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
  uploads:
